name: Android shell build
on:
  push:
    branches: [s3-android-build]
    paths: ['android-shell/**', '.github/workflows/android-shell.yml']
permissions:
  contents: read
concurrency:
  group: generic-android-shell
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Generate and harden generic project
        run: |
          python android-shell/generate.py
          python - <<'PY'
          from pathlib import Path
          p=Path('android-shell/project/app/build.gradle')
          t=p.read_text().replace('minSdk 26;', 'minSdk 33; ndk { abiFilters "arm64-v8a" };')
          t+='\nconfigurations.configureEach { resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" }\n'
          p.write_text(t)
          p=Path('android-shell/project/app/src/main/java/com/shift/systemsafe/MainActivity.java')
          t=p.read_text().replace('private class Bridge {','public class Bridge {')
          t=t.replace('protected void onPause(){stopListening();','protected void onPause(){if(pendingMicId!=null){super.onPause();return;}stopListening();')
          old='tts.setLanguage(l);tts.setSpeechRate'
          new='tts.setLanguage(l); if(!a.optBoolean("networkAllowed",false)){ Voice selected=null; java.util.Set<Voice> voices=tts.getVoices(); if(voices!=null)for(Voice v:voices){if(v.getLocale().getLanguage().equals(l.getLanguage())&&!v.isNetworkConnectionRequired()){selected=v;break;}} if(selected==null){reply(id,null,"No offline voice is installed for this language. Install a phone voice or explicitly allow online speech in Audio settings.");return;} tts.setVoice(selected); } tts.setSpeechRate'
          assert old in t
          t=t.replace(old,new)
          p.write_text(t)
          PY
          python android-shell/mobile_language_patch.py
          python android-shell/safe_area_patch.py
          sed -i "s/versionName '1.0.1'/versionName '1.0.2'/" android-shell/project/app/build.gradle
      - name: Compile and lint Android application
        run: gradle -p android-shell/project --no-daemon assembleRelease lintRelease
      - name: Prepare bounded build output
        run: |
          mkdir -p output
          cp android-shell/project/app/build/outputs/apk/release/app-release-unsigned.apk output/shell-unsigned.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp "$TOOLS/lib/apksigner.jar" output/
          cp "$TOOLS/zipalign" output/
          cp "$TOOLS/aapt2" output/
          cp android-shell/project/app/build/reports/lint-results-release.txt output/
          cp android-shell/project/app/src/main/java/com/shift/systemsafe/MainActivity.java output/
          find output -type f ! -name SHA256SUMS -exec sha256sum {} \; > output/SHA256SUMS
          test "$(du -sm output | cut -f1)" -lt 40
      - name: Save compiled generic ARM64 release
        uses: actions/upload-artifact@v4
        with:
          name: generic-android-shell
          path: output/
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
      - name: Enable hardware acceleration for synthetic emulator
        run: |
          test -e /dev/kvm
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile synthetic x86 emulator test APKs
        run: |
          sed -i 's/abiFilters "arm64-v8a"/abiFilters "x86_64"/' android-shell/project/app/build.gradle
          python - <<'PY'
          import json,re
          from pathlib import Path
          root=Path('android-shell/project/app/src')
          p=root/'androidTest/java/com/shift/systemsafe/SafeAreaTest.java'
          t=p.read_text()
          literal=re.search(r'private static final String HTML=(".*");',t).group(1)
          fixture=root/'debug/assets/layout_test.html'
          fixture.parent.mkdir(parents=True,exist_ok=True)
          fixture.write_text(json.loads(literal))
          old='web.loadDataWithBaseURL("https://appassets.androidplatform.net/assets/",HTML,"text/html","UTF-8",null);'
          assert old in t
          t=t.replace(old,'web.stopLoading();web.loadUrl("https://appassets.androidplatform.net/assets/layout_test.html");')
          t=t.replace('web.evaluateJavascript(expression,','web.evaluateJavascript("JSON.stringify("+expression+")",')
          t=t.replace('return new JSONObject(value.get());','return new JSONObject((String)new org.json.JSONTokener(value.get()).nextValue());')
          t=t.replace('n<50','n<150')
          t=t.replace('fail("Synthetic page failed to load");','fail("Synthetic page failed to load: "+js("({url:location.href,state:document.readyState,body:document.body?document.body.innerText.slice(0,200):null})"));')
          p.write_text(t)
          PY
          gradle -p android-shell/project --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Test actual Android system bars, touch targets, rotation and keyboard
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 2048M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            mkdir -p device-test-output
            adb install -r android-shell/project/app/build/outputs/apk/debug/app-debug.apk
            adb install -r android-shell/project/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.threebutton
            sleep 3
            adb shell am instrument -w -r com.shift.systemsafe.test/androidx.test.runner.AndroidJUnitRunner | tee device-test-output/three-button.txt
            adb logcat -d -s System.out:I chromium:E AndroidRuntime:E > device-test-output/three-button-log.txt
            grep -q 'OK (3 tests)' device-test-output/three-button.txt
            adb shell cmd overlay enable-exclusive --category com.android.internal.systemui.navbar.gestural
            sleep 3
            adb shell am instrument -w -r com.shift.systemsafe.test/androidx.test.runner.AndroidJUnitRunner | tee device-test-output/gesture.txt
            adb logcat -d -s System.out:I chromium:E AndroidRuntime:E > device-test-output/gesture-log.txt
            grep -q 'OK (3 tests)' device-test-output/gesture.txt
      - name: Save bounded synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-layout-test-evidence
          path: device-test-output/
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn
