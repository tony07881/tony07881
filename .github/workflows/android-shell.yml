name: Android shell build
on:
  push:
    branches: [s3-android-build]
    paths: ['android-shell/**', '.github/workflows/android-shell.yml']
permissions:
  contents: read
concurrency:
  group: generic-android-shell
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Generate and harden generic project
        run: |
          python android-shell/generate.py
          python - <<'PY'
          from pathlib import Path
          p=Path('android-shell/project/app/build.gradle')
          t=p.read_text().replace('minSdk 26;', 'minSdk 33; ndk { abiFilters "arm64-v8a" };')
          t+='\nconfigurations.configureEach { resolutionStrategy.force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22" }\n'
          p.write_text(t)
          p=Path('android-shell/project/app/src/main/java/com/shift/systemsafe/MainActivity.java')
          t=p.read_text().replace('private class Bridge {','public class Bridge {')
          t=t.replace('protected void onPause(){stopListening();','protected void onPause(){if(pendingMicId!=null){super.onPause();return;}stopListening();')
          old='tts.setLanguage(l);tts.setSpeechRate'
          new='tts.setLanguage(l); if(!a.optBoolean("networkAllowed",false)){ Voice selected=null; java.util.Set<Voice> voices=tts.getVoices(); if(voices!=null)for(Voice v:voices){if(v.getLocale().getLanguage().equals(l.getLanguage())&&!v.isNetworkConnectionRequired()){selected=v;break;}} if(selected==null){reply(id,null,"No offline voice is installed for this language. Install a phone voice or explicitly allow online speech in Audio settings.");return;} tts.setVoice(selected); } tts.setSpeechRate'
          assert old in t
          t=t.replace(old,new)
          p.write_text(t)
          PY
      - name: Compile Android application
        run: gradle -p android-shell/project --no-daemon assembleRelease
      - name: Prepare bounded build output
        run: |
          mkdir -p output
          cp android-shell/project/app/build/outputs/apk/release/app-release-unsigned.apk output/shell-unsigned.apk
          TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          cp "$TOOLS/lib/apksigner.jar" output/
          cp "$TOOLS/zipalign" output/
          cp "$TOOLS/aapt2" output/
          find output -type f ! -name SHA256SUMS -exec sha256sum {} \; > output/SHA256SUMS
          du -h output/*
          test "$(du -sm output | cut -f1)" -lt 40
      - uses: actions/upload-artifact@v4
        with:
          name: generic-android-shell
          path: output/
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
